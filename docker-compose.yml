services:
  postgres:
    image: postgres:15-alpine
    container_name: smf_postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    command: postgres -c max_connections=500 -c shared_buffers=128MB
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    cpuset: "0"
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '0.2'
    #       memory: 512M
        # reservations:
        #   cpus: '0.5'
        #   memory: 256M

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: smf_pgadmin
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD}
      - PGADMIN_CONFIG_SERVER_MODE=False
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    cpuset: "0"
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '0.5'
    #       memory: 512M
    #     reservations:
    #       cpus: '0.1'
    #       memory: 256M

  gateway:
    build:
      context: ./gateway
    container_name: smf_gateway
    ports:
      - "8000:8000"
    depends_on:
      - pdu_1
      - pdu_2
      - pdu_3
    cpuset: "0"
    network_mode: "host"
    environment:
      - GOMAXPROCS=1
      - GOGC=1000
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '0.5'
    #       memory: 128M
        # reservations:
        #   cpus: '0.25'
        #   memory: 64M

  pdu_1:
    build:
      context: ./pdu_backend
    # container_name: smf_pdu_1
    command: ["./pdu_app"]
    depends_on:
      postgres:
        condition: service_healthy
    cpuset: "0"
    network_mode: "host"
    environment:
      - DB_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@127.0.0.1:5433/${POSTGRES_DB}?sslmode=disable
      - GATEWAY_URL=http://127.0.0.1:8000
      - GOMAXPROCS=1
      - GOGC=1000
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '0.1'
    #       memory: 128M
        # reservations:
        #   cpus: '0.25'
        #   memory: 64M

  pdu_2:
    build:
      context: ./pdu_backend
    # container_name: smf_pdu_2
    command: ["./pdu_app"]
    depends_on:
      postgres:
        condition: service_healthy
    cpuset: "0"
    network_mode: "host"
    environment:
      - DB_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@127.0.0.1:5433/${POSTGRES_DB}?sslmode=disable
      - GATEWAY_URL=http://127.0.0.1:8000
      - GOMAXPROCS=1
      - GOGC=1000
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '0.1'
    #       memory: 128M
        # reservations:
        #   cpus: '0.25'
        #   memory: 64M

  pdu_3:
    build:
      context: ./pdu_backend
    # container_name: smf_pdu_3
    command: ["./pdu_app"]
    depends_on:
      postgres:
        condition: service_healthy
    cpuset: "0"
    network_mode: "host"
    environment:
      - DB_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@127.0.0.1:5433/${POSTGRES_DB}?sslmode=disable
      - GATEWAY_URL=http://127.0.0.1:8000
      - GOMAXPROCS=1
      - GOGC=1000
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '0.1'
    #       memory: 128M
        # reservations:
        #   cpus: '0.25'
        #   memory: 64M

  load_tester:
    build:
      context: ./load_test
    image: smf_load_tester:latest
    container_name: smf_load_test
    network_mode: "host"
    environment:
      - GATEWAY_URL=http://127.0.0.1:8000
    depends_on:
      - gateway
    profiles:
      - manual_test
    cpuset: "1"

volumes:
  postgres_data: