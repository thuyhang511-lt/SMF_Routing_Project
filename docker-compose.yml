services:
  postgres:
    image: postgres:15-alpine
    container_name: smf_postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '2.0'
    #       memory: 512M
    #     reservations:
    #       cpus: '0.5'
    #       memory: 256M

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: smf_pgadmin
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD}
      - PGADMIN_CONFIG_SERVER_MODE=False
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '0.5'
    #       memory: 512M
    #     reservations:
    #       cpus: '0.1'
    #       memory: 256M

  gateway:
    build:
      context: ./gateway
    container_name: smf_gateway
    ports:
      - "8000:8000"
    depends_on:
      - pdu_1
      - pdu_2
      - pdu_3
    #   - GOMAXPROCS=1
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '2.0'
    #       memory: 128M
    #     reservations:
    #       cpus: '0.25'
    #       memory: 64M

  pdu_1:
    build:
      context: ./pdu_backend
    # container_name: smf_pdu_1
    command: ["./pdu_app"]
    environment:
      # Sử dụng hostname 'postgres' do Docker tự động phân giải IP
      - DB_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable&pool_max_conns=100
      - GATEWAY_URL=http://gateway:8000
      # - GOMAXPROCS=1
    depends_on:
      postgres:
        condition: service_healthy
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '1.0'
    #       memory: 128M
    #     reservations:
    #       cpus: '0.25'
    #       memory: 64M

  pdu_2:
    build:
      context: ./pdu_backend
    # container_name: smf_pdu_2
    command: ["./pdu_app"]
    environment:
      - DB_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable&pool_max_conns=100
      - GATEWAY_URL=http://gateway:8000
    #  - GOMAXPROCS=1
    depends_on:
      postgres:
        condition: service_healthy
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '1.0'
    #       memory: 128M
    #     reservations:
    #       cpus: '0.25'
    #       memory: 64M

  pdu_3:
    build:
      context: ./pdu_backend
    # container_name: smf_pdu_3
    command: ["./pdu_app"]
    environment:
      - DB_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable&pool_max_conns=100
      - GATEWAY_URL=http://gateway:8000
    #  - GOMAXPROCS=1
    depends_on:
      postgres:
        condition: service_healthy
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '1.0'
    #       memory: 128M
    #     reservations:
    #       cpus: '0.25'
    #       memory: 64M

volumes:
  postgres_data:

# sẽ có những mốc như khoảng 35k request mà đến đó, qua khoảng vài chục giây mà ko có context nào đc ghi vào db
# khi đó CPU usage cũng rất thấp, khoảng 0-vài%/800%