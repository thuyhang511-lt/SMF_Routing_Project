services:
  postgres:
    image: postgres:15-alpine
    container_name: smf_postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB={POSTGRES_DB}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smf_user -d smf_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '2.0'
    #       memory: 512M
    #     reservations:
    #       cpus: '0.5'
    #       memory: 256M

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: smf_pgadmin
    environment:
      - PGADMIN_DEFAULT_EMAIL={PGADMIN_DEFAULT_EMAIL}
      - PGADMIN_DEFAULT_PASSWORD={PGADMIN_DEFAULT_PASSWORD}
      - PGADMIN_CONFIG_SERVER_MODE=False
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '0.5'
    #       memory: 512M
    #     reservations:
    #       cpus: '0.1'
    #       memory: 256M

  gateway:
    build:
      context: ./gateway
    container_name: smf_gateway
    ports:
      - "8000:8000"
    depends_on:
      - pdu_1
      - pdu_2
      - pdu_3
    environment:
      # Chuyển hướng traffic xuống các PDU container thay vì localhost
      - BACKEND_URLS=http://pdu_1:8081,http://pdu_2:8082,http://pdu_3:8083
    #   - GOMAXPROCS=1
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '2.0'
    #       memory: 128M
    #     reservations:
    #       cpus: '0.25'
    #       memory: 64M

  pdu_1:
    build:
      context: ./pdu_backend
    container_name: smf_pdu_1
    command: ["-port=8081"]
    ports:
      - "8081:8081"
    environment:
      # Sử dụng hostname 'postgres' do Docker tự động phân giải IP
      - DB_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      # - GOMAXPROCS=1
    depends_on:
      postgres:
        condition: service_healthy
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '1.0'
    #       memory: 128M
    #     reservations:
    #       cpus: '0.25'
    #       memory: 64M

  pdu_2:
    build:
      context: ./pdu_backend
    container_name: smf_pdu_2
    command: ["-port=8082"]
    ports:
      - "8082:8082"
    environment:
      - DB_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    #  - GOMAXPROCS=1
    depends_on:
      postgres:
        condition: service_healthy
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '1.0'
    #       memory: 128M
    #     reservations:
    #       cpus: '0.25'
    #       memory: 64M

  pdu_3:
    build:
      context: ./pdu_backend
    container_name: smf_pdu_3
    command: ["-port=8083"]
    ports:
      - "8083:8083"
    environment:
      - DB_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    #  - GOMAXPROCS=1
    depends_on:
      postgres:
        condition: service_healthy
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '1.0'
    #       memory: 128M
    #     reservations:
    #       cpus: '0.25'
    #       memory: 64M

volumes:
  postgres_data:

# sẽ có những mốc như khoảng 35k request mà đến đó, qua khoảng vài chục giây mà ko có context nào đc ghi vào db
# khi đó CPU usage cũng rất thấp, khoảng 0-vài%/800%